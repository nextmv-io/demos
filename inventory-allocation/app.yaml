type: python
runtime: ghcr.io/nextmv-io/runtime/python:3.11
python:
  pip-requirements: requirements.txt
files:
- main.py
- visuals.py
configuration:
  options:
    strict: false
    items:
    - name: input
      option_type: string
      default: ''
      description: ''
      required: false
      ui:
        control_type: input
        hidden_from:
        - operator
    - name: output
      option_type: string
      default: ''
      description: ''
      required: false
      ui:
        control_type: input
        hidden_from:
        - operator
    - name: solver
      option_type: string
      default: highs
      description: ''
      required: false
      additional_attributes:
        values:
        - highs
        - cbc
        - glpk
      ui:
        control_type: select
        display_name: Solver
    - name: penalty_unmet_demand
      option_type: float
      default: 100
      description: ''
      required: false
      additional_attributes:
        min: 0
        max: 1000
        step: 10
      ui:
        control_type: slider
        display_name: Penalty for Unmet Demand (per unit)
    - name: time_limit
      option_type: float
      default: 30
      description: ''
      required: false
      additional_attributes:
        min: 5
        max: 300
        step: 5
      ui:
        control_type: slider
        display_name: Solver Time Limit (seconds)
