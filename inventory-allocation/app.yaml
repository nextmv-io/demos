type: python
runtime: ghcr.io/nextmv-io/runtime/pyomo:latest
python:
  pip-requirements: requirements.txt
files:
- main.py
- visuals.py
configuration:
  # Define the content format of the app, one of: json, multi-file.
  content:
    format: "json" # Read JSON from stdin and write JSON to stdout.
  options:
    strict: false
    items:
    - name: input
      option_type: string
      default: ''
      description: ''
      required: false
      ui:
        control_type: input
        hidden_from:
        - admin
    - name: output
      option_type: string
      default: ''
      description: ''
      required: false
      ui:
        control_type: input
        hidden_from:
        - admin
    - name: solver
      option_type: string
      default: glpk
      description: ''
      required: false
      additional_attributes:
        values:
        - highs
        - cbc
        - glpk
      ui:
        control_type: select
        display_name: Solver
    - name: penalty_unmet_demand
      option_type: float
      default: 100
      description: ''
      required: false
      additional_attributes:
        min: 0
        max: 1000
        step: 10
      ui:
        control_type: slider
        display_name: Penalty for Unmet Demand (per unit)
    - name: supply_utilization_min
      option_type: float
      default: 0
      description: ''
      required: false
      additional_attributes:
        min: 0
        max: 1
        step: 0.05
      ui:
        control_type: slider
        display_name: Min Supply Utilization (fraction)
    - name: cost_threshold
      option_type: float
      default: 0
      description: ''
      required: false
      ui:
        control_type: input
        display_name: Max Lane Cost (0 = no limit)
    - name: time_limit
      option_type: float
      default: 30
      description: ''
      required: false
      additional_attributes:
        min: 5
        max: 300
        step: 5
      ui:
        control_type: slider
        display_name: Solver Time Limit (seconds)
