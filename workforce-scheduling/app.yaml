type: python
runtime: ghcr.io/nextmv-io/runtime/python:3.11
python:
  pip-requirements: requirements.txt
files:
- main.py
- visuals.py
configuration:
  options:
    strict: false
    items:
    - name: population_size
      option_type: int
      default: 100
      description: ''
      required: false
      additional_attributes:
        min: 20
        max: 300
        step: 20
      ui:
        control_type: slider
        display_name: Population Size
    - name: num_generations
      option_type: int
      default: 100
      description: ''
      required: false
      additional_attributes:
        min: 20
        max: 500
        step: 20
      ui:
        control_type: slider
        display_name: Number of Generations
    - name: mutation_rate
      option_type: float
      default: 0.02
      description: ''
      required: false
      additional_attributes:
        min: 0.001
        max: 0.1
        step: 0.001
      ui:
        control_type: slider
        display_name: Per-Gene Mutation Rate
    - name: crossover_rate
      option_type: float
      default: 0.9
      description: ''
      required: false
      additional_attributes:
        min: 0.5
        max: 1.0
        step: 0.05
      ui:
        control_type: slider
        display_name: Crossover Rate
    - name: seed
      option_type: int
      default: 42
      description: ''
      required: false
      ui:
        control_type: input
        hidden_from:
        - operator
        display_name: Random Seed
