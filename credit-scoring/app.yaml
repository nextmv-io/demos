type: python
runtime: ghcr.io/nextmv-io/runtime/python:3.11
python:
  pip-requirements: requirements.txt
files:
- main.py
- visuals.py
configuration:
  options:
    strict: false
    items:
    - name: input
      option_type: string
      default: ''
      description: ''
      required: false
      ui:
        control_type: input
        hidden_from:
        - admin
    - name: output
      option_type: string
      default: ''
      description: ''
      required: false
      ui:
        control_type: input
        hidden_from:
        - admin
    - name: model_type
      option_type: string
      default: random_forest
      description: ''
      required: false
      additional_attributes:
        values:
        - logistic_regression
        - random_forest
        - gradient_boosting
      ui:
        control_type: select
        display_name: Model Type
    - name: n_estimators
      option_type: int
      default: 100
      description: ''
      required: false
      additional_attributes:
        min: 10
        max: 300
        step: 10
      ui:
        control_type: slider
        display_name: Number of Estimators (trees)
    - name: approval_threshold
      option_type: float
      default: 0.7
      description: ''
      required: false
      additional_attributes:
        min: 0.5
        max: 0.95
        step: 0.05
      ui:
        control_type: slider
        display_name: Approval Threshold (min score to approve)
    - name: review_threshold
      option_type: float
      default: 0.4
      description: ''
      required: false
      additional_attributes:
        min: 0.1
        max: 0.65
        step: 0.05
      ui:
        control_type: slider
        display_name: Review Threshold (min score to flag for review)
